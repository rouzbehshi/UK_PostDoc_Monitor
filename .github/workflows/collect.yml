name: Collect university research jobs

on:
  schedule:
    - cron: "30 4 * * *"   # every day 04:30 UTC (05:30-06:30 in Italy)
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      reset:
        description: "Forget everything seen so far and start a fresh baseline (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect
        run: |
          if [ "${{ inputs.reset }}" = "yes" ]; then rm -f data/seen.json; fi
          mkdir -p logs
          set -o pipefail
          python -u collector.py 2>&1 | tee logs/latest_run.log

      - name: Save results
        if: always()
        run: |
          git config user.name "uk-postdoc-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in data reports logs; do [ -e "$d" ] && git add -A "$d"; done
          git commit -m "Daily collection $(date -u +%F)" || echo "Nothing to commit"
          git pull --rebase --autostash
          git push
